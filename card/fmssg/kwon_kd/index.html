                modal.classList.add("open");
            });
            document.getElementById("btnCloseActionModal").addEventListener("click", function() {
                modal.classList.remove("open");
            });
            modal.addEventListener("click", function(e) {
                if (e.target === modal) modal.classList.remove("open");
            });

            document.getElementById("btnModalSms").addEventListener("click", function() {

                window.location.href = "sms:" + sep + "body=" + encodeURIComponent(SMS_BODY);
            });

            document.getElementById("btnModalKakao").addEventListener("click", async function() {
                if (navigator.share) {
                    try {
                        await navigator.share({ title: TITLE_TXT, text: SMS_BODY, url: PAGE_URL });
                        return;
                    } catch (e) {}
                }
                try {
                    await navigator.clipboard.writeText(SMS_BODY);
